[workspace]
members = [
    "crates/tatacoa-core",
    "crates/tatacoa-app-api",
    "crates/tatacoa-desktop",
    "crates/tatacoa-cli",
    "crates/tatacoa-verifier",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
aead-stream = { version = "0.6", features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4", features = ["derive"] }
cms = "0.2.3"
cmpv2 = "0.2.0"
der = { version = "0.7.10", features = ["alloc", "derive", "oid"] }
getrandom = "0.4"
hkdf = "0.13"
pkcs1 = "0.7.5"
rpassword = "7.5.4"
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103.15", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
x509-cert = "0.2"
x509-tsp = "0.1.0"
zeroize = { version = "1.9", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
