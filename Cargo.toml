[workspace]
members = [
    "crates/tatacoa-core",
    "crates/tatacoa-cli",
    "crates/tatacoa-verifier",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
aead-stream = { version = "0.6", features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
hkdf = "0.13"
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.9", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
